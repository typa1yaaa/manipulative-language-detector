services:
  backend:
    image: ghcr.io/typa1yaaa/manipulation-detector-backend:latest

    ports:
      - "8000:8000"

    environment:
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "600"
      HF_HUB_ETAG_TIMEOUT: "60"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

    restart: unless-stopped

  frontend:
    image: ghcr.io/typa1yaaa/manipulation-detector-frontend:latest

    ports:
      - "8501:8501"

    environment:
      API_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped