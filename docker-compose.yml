services:
  backend:
    build:
      context: .
      dockerfile: service/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
 
  frontend:
    build:
      context: .
      dockerfile: service/frontend/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
 
